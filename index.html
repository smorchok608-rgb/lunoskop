<title>Луноскоп</title>
<style>
:root{--bg:#070b1a;--gold:#d9b86c;--ink:#e8e2cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 30%,#14204a,var(--bg) 70%);color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;user-select:none;-webkit-user-select:none}
h1{margin:0;font-weight:400;letter-spacing:.35em;text-transform:uppercase;font-size:clamp(15px,3.4vw,22px);color:var(--gold)}
#scope{position:relative;width:min(92vw,calc(100dvh - 40px),640px);aspect-ratio:1210/1226;touch-action:none;cursor:grab}
#scope:active{cursor:grabbing}
#view{position:absolute;left:50%;top:50%;width:86%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;background:#050813}
#ticks,#shade,#core,#lum{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
#frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#glow{position:absolute;left:50%;top:50%;width:86%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:2;box-shadow:inset 0 0 40px 12px rgba(5,8,19,.85)}
#st{min-height:1.4em;font-style:italic;font-size:clamp(13px,3.3vw,16px);text-align:center;padding:0 12px}
.dials{display:flex;gap:18px;font-size:12px;letter-spacing:.12em;color:#9aa3c2;text-transform:uppercase}
.dials b{color:var(--gold);font-weight:400;font-variant-numeric:tabular-nums}
.hint{font-size:11px;color:#6f7899;text-align:center;padding:0 16px}

const ss=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
function render(){
  const cm=ss(1-(dist(A)-3)/45), cn=ss(1-(dist(B)-3)/30), cd=ss(1-(dist(D)-3)/45);
  frame.style.transform='rotate('+R+'deg)';
  map.style.transform='rotate('+A+'deg)';map.style.opacity=cm.toFixed(3);
  bw.style.transform='rotate('+D+'deg)';bw.style.opacity=(.3+.7*cd).toFixed(3);bw.style.filter='blur('+((1-cd)*6).toFixed(1)+'px)';
  map.style.filter='blur('+((1-cm)*7).toFixed(1)+'px) grayscale('+(1-cm).toFixed(2)+') brightness('+(.28+.72*cm).toFixed(2)+') contrast('+(.8+.2*cm).toFixed(2)+')';
  ticks.style.transform='rotate('+B+'deg)';
  nums.style.transform='rotate('+B+'deg)';
  nums.style.opacity=(cn*.92).toFixed(2);
  nums.style.mixBlendMode='multiply';
  core.style.transform='rotate('+C+'deg)';
  const p=mod(C)/360,w=p<=.5,q=w?p:1-p,k=Math.cos(2*Math.PI*q);
  shp.setAttribute('d','M0 -100A100 100 0 0 1 0 100A100 100 0 0 1 0 -100Z M0 -100A100 100 0 0 1 0 100A'+(Math.abs(k)*100).toFixed(2)+' 100 0 0 '+(k>0?0:1)+' 0 -100Z');
  shp.setAttribute('transform',w?'':'scale(-1 1)');
  shp2.setAttribute('d',shp.getAttribute('d'));shp2.setAttribute('transform',w?'':'scale(-1 1)');
  lg.setAttribute('transform','rotate('+B+')');lg2.setAttribute('transform','rotate('+B+')');
  G.cm=cm;G.cn=cn;G.cd=cd;G.cr=ss(1-(dist(R)-3)/25);G.cp=ss(1-(dist(C)-8)/35);
}
let last=null,zone='in';
const pt=e=>{const r=scope.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);return{a:Math.atan2(y,x)*180/Math.PI,r:Math.hypot(x,y)/(r.width/2)}};
scope.addEventListener('pointerdown',e=>{scope.setPointerCapture(e.pointerId);const p=pt(e);last=p.a;zone=p.r>.85?'out':p.r>.40?'in':'core'});
scope.addEventListener('pointermove',e=>{
  if(last===null)return;const a=pt(e).a;let d=a-last;
  if(d>180)d-=360;if(d<-180)d+=360;last=a;
  if(zone==='out'){R+=d;if(d>0)A+=d;else D+=d}   // внешнее кольцо: крутит кольцо и карту (назад карта идёт медленнее)
  else if(zone==='core'){C+=d}              // центральный диск: фазы Луны
  else{B+=d>0?d:d*2}                       // внутренний диск: крутит числа (против часовой — вдвое быстрее)
  render();
});
function snap(){const s=v=>{const m=mod(v),d=m<180?m:m-360;return Math.abs(d)<4?v-d:v};A=s(A);B=s(B);D=s(D);R=s(R);C=Math.round(C/45)*45-C>-3&&Math.round(C/45)*45-C<3?Math.round(C/45)*45:C;render()}
const end=()=>{last=null;snap()};
scope.addEventListener('pointerup',end);scope.addEventListener('pointercancel',end);
addEventListener('keydown',e=>{
  const k={ArrowRight:()=>{R+=3;A+=3},ArrowLeft:()=>{R-=3;D-=3},ArrowUp:()=>{B+=3},ArrowDown:()=>{B-=6},PageUp:()=>{C+=3},PageDown:()=>{C-=3}}[e.key];
  if(!k)return;k();render();clearTimeout(window._t);window._t=setTimeout(snap,300);
});
render();
(function loop(t){const p=.85+.15*Math.sin(t/650);
  gm1.style.opacity=(G.cn*G.cm*G.cm*.34*p).toFixed(3);              // первые 4 цифры: цифры + карта
  gm2.style.opacity=(G.cn*G.cd*(1-G.cm)*.34*p).toFixed(3);          // другие 4 цифры: цифры + ч/б Луна, цветная карта скрыта
  gm3.style.opacity=(G.cr*G.cp*.95).toFixed(3);                     // таблички: внешнее кольцо ровно + почти новолуние
  requestAnimationFrame(loop)})(0);
</script></body></html>
